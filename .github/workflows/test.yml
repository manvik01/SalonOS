name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salonos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salonos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/salonos_test
      DATABASE_URL: postgres://salonos_app:salonos_app@127.0.0.1:5432/salonos_test
      APP_DB_PASSWORD: salonos_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
